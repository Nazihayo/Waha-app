<body>

<div id="installBanner" style="display:none;position:fixed;bottom:0;inset-inline:0;z-index:200;background:var(--accent-surface);color:var(--accent-text);padding:14px 18px;font-size:13px;display:flex;align-items:center;gap:12px;box-shadow:0 -6px 20px rgba(0,0,0,0.2);">

<header>
  <nav>
    <div class="brand">Wa<span>ha</span></div>

    <div class="prefs-row">

        <p class="prefs-row-desc" data-i18n="prefs_dark_desc"></p>

        <p class="prefs-row-title" data-i18n="progress_disable_streaks_title"></p>
        <p class="prefs-row-desc" data-i18n="progress_disable_streaks_desc"></p>

    <p class="backup-desc" data-i18n="backup_desc"></p>

      <input type="file" id="importFileInput" accept="application/json" style="display:none;" data-change="importBackup">

    <div class="prefs-section-label" data-i18n="prefs_privacy_label"></div>
    <div class="prefs-quote-box">

<div class="prefs-overlay" id="explainFeelingModal" role="dialog" aria-modal="true">

    <button class="prefs-close aria-close-btn" data-click="closeExplainFeeling" aria-label="Close">✕</button>

    <p class="prefs-subtitle" data-i18n="ef_intro"></p>

    <div id="efFormView">
      <div class="calmplan-field">
        <label class="calmplan-label" data-i18n="ef_f_now"></label>
        <input type="text" id="efNow" class="calmplan-input" data-i18n-placeholder="ef_ph_now">
      </div>
      <div class="calmplan-field">
        <label class="calmplan-label" data-i18n="ef_f_after"></label>
        <input type="text" id="efAfter" class="calmplan-input" data-i18n-placeholder="ef_ph_after">
      </div>
      <div class="calmplan-field">
        <label class="calmplan-label" data-i18n="ef_f_affecting"></label>
        <input type="text" id="efAffecting" class="calmplan-input" data-i18n-placeholder="ef_ph_affecting">
      </div>
      <div class="calmplan-field">
        <label class="calmplan-label" data-i18n="ef_f_hardest"></label>
        <input type="text" id="efHardest" class="calmplan-input" data-i18n-placeholder="ef_ph_hardest">
      </div>
      <div class="calmplan-field">
        <label class="calmplan-label" data-i18n="ef_f_need"></label>
        <input type="text" id="efNeed" class="calmplan-input" data-i18n-placeholder="ef_ph_need">
      </div>
      <div class="calmplan-field">
        <label class="calmplan-label" data-i18n="ef_f_help"></label>
        <input type="text" id="efHelp" class="calmplan-input" data-i18n-placeholder="ef_ph_help">
      </div>

      <button class="backup-btn" style="width:100%;" data-click="generateFeelingDraft" data-i18n="ef_generate"></button>

        <button class="ef-tone-btn active" id="efToneConciseBtn" data-click="setFeelingTone:concise" data-i18n="ef_tone_concise"></button>
        <button class="ef-tone-btn" id="efToneDetailedBtn" data-click="setFeelingTone:detailed" data-i18n="ef_tone_detailed"></button>
      </div>
      <div class="ef-preview-box" id="efPreviewText"></div>
      <div class="passport-btn-grid">
        <button class="backup-btn" data-click="copyFeelingDraft" data-i18n="ef_copy"></button>
        <button class="backup-btn" data-click="printFeelingDraft" data-i18n="calmplan_print"></button>
        <button class="backup-btn" data-click="exportFeelingDraft" data-i18n="calmplan_export"></button>
        <button class="backup-btn" data-click="backToEditFeeling" data-i18n="ef_back_edit"></button>
      </div>
      <button class="backup-btn backup-btn-ghost" style="width:100%;margin-top:10px;" data-click="rewriteFeelingWithAI" id="efAiBtn">✨ <span data-i18n="ef_ai_rewrite"></span></button>
      <p class="ef-ai-note" data-i18n="ef_ai_note"></p>
    </div>
    <p class="backup-status" id="efStatus"></p>
  </div>
</div>

<div class="prefs-overlay" id="whyExplainModal" role="dialog" aria-modal="true">

</div>

<div class="prefs-overlay" id="calmPlanModal" role="dialog" aria-modal="true">

        <input type="text" id="cpExercise" class="calmplan-input" data-i18n-placeholder="calmplan_ph_exercise">
      </div>
      <div class="calmplan-field">
        <label class="calmplan-label" data-i18n="calmplan_f_sentence"></label>
        <input type="text" id="cpSentence" class="calmplan-input" data-i18n-placeholder="calmplan_ph_sentence">
      </div>
      <div class="calmplan-field">
        <label class="calmplan-label" data-i18n="calmplan_f_place"></label>
        <input type="text" id="cpPlace" class="calmplan-input" data-i18n-placeholder="calmplan_ph_place">
      </div>
      <div class="calmplan-field">
        <label class="calmplan-label" data-i18n="calmplan_f_activity"></label>
        <input type="text" id="cpActivity" class="calmplan-input" data-i18n-placeholder="calmplan_ph_activity">
      </div>
      <div class="calmplan-field">
        <label class="calmplan-label" data-i18n="calmplan_f_person"></label>
        <input type="text" id="cpPerson" class="calmplan-input" data-i18n-placeholder="calmplan_ph_person">
      </div>
      <div class="calmplan-field">
        <label class="calmplan-label" data-i18n="calmplan_f_steps"></label>
        <textarea id="cpSteps" class="calmplan-textarea" rows="3" data-i18n-placeholder="calmplan_ph_steps"></textarea>

      <button class="backup-btn" style="width:100%;" data-click="saveCalmPlan" data-i18n="calmplan_save"></button>
    </div>

    <div id="calmPlanViewMode" style="display:none;">
      <div class="calmplan-view-row" id="cpvExercise"></div>
      <div class="calmplan-view-row" id="cpvSentence"></div>
      <div class="calmplan-view-row" id="cpvPlace"></div>
      <div class="calmplan-view-row" id="cpvActivity"></div>
      <div class="calmplan-view-row" id="cpvPerson"></div>
      <div class="calmplan-view-row" id="cpvSteps"></div>
      <div class="passport-btn-grid" style="margin-top:16px;">
        <button class="backup-btn" data-click="editCalmPlan" data-i18n="calmplan_edit"></button>
        <button class="backup-btn" data-click="exportCalmPlan" data-i18n="calmplan_export"></button>
        <button class="backup-btn" data-click="printCalmPlan" data-i18n="calmplan_print"></button>
        <button class="backup-btn" style="background:#c94a4a;color:#fff;border-color:#c94a4a;" data-click="confirmDeleteCalmPlan" data-i18n="calmplan_delete"></button>
      </div>

    <div class="calmplan-crisis-link">

      <button class="relief-stop-link" style="display:inline;color:#c94a4a;" data-click="closeCalmPlan,openCrisis" data-i18n="calmplan_crisis_btn"></button>
    </div>
  </div>
</div>

<div class="prefs-overlay" id="passportModal" role="dialog" aria-modal="true">

      <div>

      </div>

    <button class="backup-btn" style="width:100%;margin-top:10px;background:#c94a4a;color:#fff;border-color:#c94a4a;" data-click="confirmDeleteEverything" data-i18n="passport_del_all"></button>
    <p class="backup-status" id="passportStatus"></p>

<div id="reminderBanner" class="reminder-banner" style="display:none;">
  <span class="reminder-icon">🌤️</span>
  <span id="reminderText" class="reminder-text"></span>

  <button class="reminder-dismiss" data-click="dismissReminder" aria-label="Close">✕</button>
</div>

<div class="hero">
  <div class="ambient"><div class="blob blob1"></div><div class="blob blob2"></div></div>
  <div>
    <span class="eyebrow" data-i18n="hero_eyebrow"></span>
    <h1 data-i18n="hero_title"></h1>
    <p class="lead" data-i18n="hero_lead"></p>
    <div class="trust-row">
      <span class="trust-chip">🔒 <span data-i18n="trust_private"></span></span>
      <span class="trust-chip">🧠 <span data-i18n="trust_cbt"></span></span>
      <span class="trust-chip">🌍 <span data-i18n="trust_multilingual"></span></span>
      <span class="trust-chip" id="streakChip" style="display:none;">🔥 <span id="streakText"></span></span>
    </div>
    <div class="cta-row">
      <button class="btn btn-primary" data-click="openRelief">⚡ <span data-i18n="relief_cta"></span></button>

      <button class="btn btn-ghost" data-click="scrollToSection:chat" data-i18n="cta_chat"></button>

      <button class="btn btn-ghost" data-click="openSounds">🎵 <span data-i18n="sounds_cta"></span></button>
      <button class="share-btn aria-share-btn" data-click="shareApp" title="share" aria-label="Share">🔗</button>
    </div>
  </div>
  <div class="breathe-stage">
    <div class="breathe-ring-outer">
      <div class="breathe-ring r1"></div>
      <div class="breathe-ring r2"></div>
      <div class="core" id="breatheCore" data-click="toggleBreathe" data-i18n="breathe_start"></div>

<section id="chat">
  <div class="section-head">

      <button class="voice-toggle" id="clearMemoryBtn" data-click="clearChatMemory" data-i18n="clear_memory_btn"></button>

    <div class="temp-mode-banner" id="tempModeBanner" data-i18n="passport_temp_active"></div>
    <div class="chat-log" id="chatLog">
