<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Waha · آراء المجربين</title>
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<main>
  <h1>آراء المجربين</h1>
  <p class="hint">هذه الصفحة لك وحدك. لا تشارك كلمة السر مع أحد.</p>

  <form id="login">
    <label for="key">كلمة سر الإدارة</label>
    <input id="key" type="password" autocomplete="current-password">
    <button type="submit">دخول</button>
    <p id="loginMsg" class="err" role="alert"></p>
  </form>

  <section id="panel" hidden>
    <div class="stats" id="stats"></div>
    <div class="usage" id="usage"></div>
    <div class="filters">
      <button type="button" data-f="pending" class="on">بانتظار المراجعة</button>
      <button type="button" data-f="approved">منشورة</button>
      <button type="button" data-f="hidden">نص مخفي</button>
      <button type="button" data-f="spam">مزعجة</button>
      <button type="button" data-f="all">الكل</button>
    </div>
    <p class="rules">
      <b>نشر</b> = يظهر النص في التطبيق (فقط إن وافق صاحبه). ·
      <b>إخفاء النص</b> = يبقى التقييم محسوباً في المتوسط، ولا يظهر النص. ·
      <b>مزعج</b> = رسالة غير حقيقية، تُحذف من المتوسط.
      لا يمكن تعديل كلام أي شخص.
    </p>
    <div id="list"></div>
  </section>
</main>
<script src="/admin.js"></script>
</body>
</html>
