[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Security headers. main.js/styles.css are now external, bundled files
# (see src/), but the markup still uses onclick="" handlers and style=""
# attributes throughout, so a strict CSP without 'unsafe-inline' would
# still break the UI — that's a real gap (an injected inline script would
# still execute) that only a further rewrite away from inline handlers can
# close. These headers still stop the cheap, high-value attacks: framing
# (clickjacking), MIME-sniffing, cross-origin fetches to anything but our
# own API, and referrer leakage of in-app URLs.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Icons/manifest/social-preview image are content-hashed by nothing (plain
# filenames), so a far-future cache is only safe because we'll rename the
# file if the image itself ever changes. They used to be inlined as data:
# URIs in the HTML (re-downloaded on every page load, never cacheable on
# their own); as real files they can now sit in the browser cache for a
# year like any other static asset.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Vite content-hashes everything under /assets/ (main.[hash].js,
# styles.[hash].css) — a new deploy always ships new filenames, so a
# far-future cache here can never serve stale content.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
