[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Security headers. script-src no longer needs 'unsafe-inline': every
# onclick="" / onchange="" / etc. attribute in the markup was converted to
# data-click / data-change / data-input / data-keydown, wired up by a
# single addEventListener-based dispatcher in src/main.js (see
# wireDataActions()), and the app is now one external, same-origin module
# script with zero inline <script> content. A CSP-blocked injected inline
# script genuinely can't execute anymore — this is real defense, not just
# a header. style-src also dropped 'unsafe-inline': every style="" in the
# markup became a CSS class (src/styles.css), and the only runtime style
# manipulation in main.js is individual el.style.property assignment
# (e.g. banner.style.display = 'flex'), which isn't inline-style-attribute
# injection and isn't gated by style-src — there's no remaining
# setAttribute('style', ...) or el.style.cssText usage.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Icons/manifest/social-preview image are content-hashed by nothing (plain
# filenames), so a far-future cache is only safe because we'll rename the
# file if the image itself ever changes. They used to be inlined as data:
# URIs in the HTML (re-downloaded on every page load, never cacheable on
# their own); as real files they can now sit in the browser cache for a
# year like any other static asset.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Vite content-hashes everything under /assets/ (main.[hash].js,
# styles.[hash].css) — a new deploy always ships new filenames, so a
# far-future cache here can never serve stale content.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
